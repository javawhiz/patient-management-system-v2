name: Build distributions

# jpackage cannot cross-compile: each installer must be built on its own
# target OS so the bundled JRE and JavaFX natives match that platform.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B clean package -DskipTests
      - run: mvn -B -Ppackage-mac package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: patient-management-system-macos
          path: app/*.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install WiX Toolset (required by jpackage --type exe)
        run: choco install wixtoolset -y
      - run: mvn -B clean package -DskipTests
      - run: mvn -B -Ppackage-windows exec:exec -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: patient-management-system-windows
          path: app/*.exe
